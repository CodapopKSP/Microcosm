<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" font-family="Noto Sans, DejaVu Sans, Liberation Sans, sans-serif"><rect width="560" height="260" fill="white"/><circle cx="170" cy="110" r="92" fill="#fbe8b8" fill-opacity="0.55" stroke="#c99a2e" stroke-dasharray="4 3"/><circle cx="200" cy="150" r="50" fill="#d6f0d6" stroke="#4f9a4f" stroke-width="1.5"/><circle cx="227.9" cy="150" r="36.8" fill="#fbd9cb" fill-opacity="0.85" stroke="#eb6834" stroke-width="1.5"/><path d="M170,110 q-24,-22 -46,-18 t-44,-12" fill="none" stroke="#2f6f2f" stroke-width="2.5"/><circle cx="170" cy="110" r="3" fill="#2f6f2f"/><text x="233.9163522034968" y="154" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">mouth</text><text x="182" y="180" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">body</text><text x="92" y="66" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">tentacle grasp</text><text x="296" y="80" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">Mouth: eats at full rate</text><text x="296" y="96" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">Rest of the body: 30% of the rate</text><text x="296" y="112" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">Tentacle: grabs one thing within its</text><text x="296" y="126" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">length of its base and drags it to the mouth</text><line x1="140.0" y1="230.0" x2="263.6" y2="230.0" stroke="#2f6f2f" stroke-width="1.5"/><path d="M270.0,230.0 L262.0,233.6 L262.0,226.4 z" fill="#2f6f2f"/><text x="204" y="246" font-size="9.5" fill="#52514e" text-anchor="middle" font-weight="normal">heading</text></svg>
# Builds Microcosm for Windows, macOS and Linux when a version tag is pushed (e.g. v0.2.0), or
# by hand from the Actions tab. The zips are attached to a GitHub release for the tag, and, if
# the itch.io secrets are set, uploaded to itch.io too. See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # an older Linux, so the build runs on more systems
            channel: linux
          - os: windows-latest
            channel: windows
          - os: macos-14 # Apple silicon
            channel: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev
      - name: Build and pack
        shell: bash
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: microcosm-${{ matrix.channel }}
          path: dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
      - name: itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        if: env.BUTLER_API_KEY != '' && env.ITCH_GAME != ''
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          version="${GITHUB_REF_NAME#v}"
          for zip in dist/*.zip; do
            case "$zip" in
              *-windows.zip) channel=windows ;;
              *-macos.zip) channel=mac ;;
              *-linux.zip) channel=linux ;;
            esac
            ./butler/butler push "$zip" "$ITCH_GAME:$channel" --userversion "$version"
          done

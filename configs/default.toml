# Evolution Simulator — default configuration.
#
# Every key is optional: anything omitted takes the built-in default (which is
# exactly what this file contains). Rules are explained in docs/DESIGN.md.
# Units: distances in world units, time in sim seconds, energy in energy units.

[world]
width = 16000.0
height = 6000.0          # the water surface is at the top
seed = 1                 # same seed + config => same run

[terrain]
cell = 8.0
floor_height = 1400.0    # mean seafloor height above the bottom
floor_roughness = 350.0
shelf_start = 0.78       # shallow shelf from this fraction of the width to the right edge
shelf_depth = 900.0      # shelf depth below the surface (sunlit seafloor)
trench_center = 0.3
trench_width = 0.06
trench_depth = 1100.0
rocks = 16               # pillars, ledges, arches, boulder fields
rock_size = 260.0

[time]
dt = 0.0333333333        # sim seconds per tick; 1x speed = 1/dt ticks per second
day_length = 600.0       # seconds per day/night cycle
year_length = 6.0        # days per year

[light]
cell = 16.0
surface_intensity = 0.1  # energy/s per unit width at the surface at noon
night_level = 0.2       # midnight light as a fraction of noon
season_amplitude = 0.3
half_depth = 400.0       # light halves every this many units of depth
body_absorptance = 0.1   # shade cast by any body
pigment_absorptance = 0.8
photo_yield = 1.0

[temperature]
cell = 64.0
surface = 20.0           # °C
season_amplitude = 6.0
deep = 4.0
thermocline_depth = 700.0
climate_amplitude = 8.0  # slow random climate drift, ±°C
climate_timescale = 40.0 # days
vent_heat = 45.0
vent_heat_radius = 260.0
update_interval = 1.0

[minerals]
cell = 32.0
diffusion = 400.0
decay = 0.004
plume_rise = 12.0        # minerals rise in vent plumes
plume_width = 96.0

[detritus]
cell = 32.0
sink_speed = 6.0         # marine snow
decay = 0.002
to_minerals = 0.5        # decomposed detritus released as minerals
diffusion = 100.0

[vents]
count = 4
output = 15.0            # mineral energy/s at full strength
radius = 48.0
lifetime_min = 2.0       # hours
lifetime_max = 8.0
min_depth = 3000.0

# How gene bytes become traits (docs/DESIGN.md §2).
[genes]
min_radius = 1.0
size_doubling = 32.0     # size gene steps per doubling of radius
speed_scale = 20.0
lifespan_base = 300.0
longevity_max = 4.0
reserves_min = 0.3
reserves_max = 3.0
toughness_min = 0.3
toughness_max = 2.0
regen_min = 0.002
regen_max = 0.05
turn_min = 0.3
turn_max = 6.0
sense_radii = 40.0
sense_cap = 1200.0
fov_min_deg = 20.0
temp_max = 40.0
tolerance_min = 1.0
tolerance_max = 15.0
generalist_penalty = 0.6   # each diet loses this x the investment in the others

# Running cost of each capability at full strength, as a fraction of basal metabolism.
[upkeep]
armor = 0.6
spikes = 0.3
jaws = 0.3
buoyancy = 0.3
reserves = 0.3
longevity = 0.4
photo = 0.3
chemo = 0.3
scavenge = 0.3
hunt = 0.4
regen = 0.2
toughness = 0.3
speed = 0.5
agility = 0.2
senses = 0.5
tolerance = 0.4

[metabolism]
basal = 0.003             # × mass^0.75 × upkeep, energy/s
move_cost = 3.0          # full-throttle swimming cost, × basal
build_cost = 1.25        # energy per unit of body mass built
body_energy = 1.0        # energy per unit of body mass eaten
growth_rate = 0.05       # max growth per second, fraction of mass
growth_buffer = 0.5      # juveniles keep this much of their reserves
regen_cost = 1.5         # energy per HP healed
starvation_damage = 1.0
temp_stress_cost = 0.5
temp_damage = 0.05
old_age_death_rate = 0.2

[feeding]
chemo_rate = 2.0
chemo_yield = 1.0
scavenge_rate = 12.0
filter_rate = 0.05
carcass_rate = 0.5
assimilation = 0.8
engulf_ratio = 0.5       # prey at most this fraction of the hunter's radius is swallowed whole
engulf_rate = 3.0
bite_rate = 0.3
armor_protection = 0.75
spike_damage = 0.6
hunger_min = 0.3
hunger_max = 1.7

[physics]
buoyancy_speed = 3.0
brownian = 8.0
response = 20.0
push_stiffness = 0.5
armor_speed_penalty = 0.3
armor_density = 0.5
carcass_sink = 2.0
carcass_min_radius = 0.0 # every corpse leaves a carcass (small ones decompose within a minute)
carcass_decay = 0.01

# Curl-noise currents: slow gyres everywhere, eddies stirring the sunlit surface layer.
[currents]
gyre_scale = 3000.0
gyre_speed = 3.0
gyre_period = 900.0
eddy_scale = 450.0
eddy_speed = 8.0
eddy_period = 180.0
mixing_depth = 450.0

[reproduction]
newborn_reserves = 0.5
cooldown = 2.0

[mutation]
rate = 0.01              # chance per gene per offspring
reroll = 0.05            # fraction of mutations that re-roll the gene
color_rate_multiplier = 3.0  # color genes mutate faster, so lineages visibly diverge

[species]
threshold = 0.025         # genetic distance from the founder that starts a new species
genus_threshold = 0.08
color_weight = 0.25
gene_cap = 0.3           # most any single gene adds to distance (so one jump isn't a species)
established = 8          # members needed before a species is named and listed
kin_threshold = 0.08     # color distance under which organisms treat each other as kin

[population]
# The ancestor: a tiny, floating, sessile green photosynthesizer.
ancestor = "A:000000 B:20A05020 C:55C000 D:FF000000 H:2030 M:000000 N:8080808080808080 R:FF00B0 S:0000 T:80A0"
initial = 2000
spawn_depth = 300.0
min_population = 100     # below this, the seed bank recolonizes
reseed_count = 300
max_population = 250000  # safety cap on births

# Random world events. "_every" values are mean sim hours between occurrences (0 = never).
[events]
enabled = true
plague_every = 8.0
plague_min_share = 0.35      # only strikes a species with at least this share of all life
plague_duration = 600.0      # seconds
plague_kill_rate = 0.002     # chance per second for each member to die
upwelling_every = 3.0
upwelling_duration = 1800.0
upwelling_rate = 40.0        # mineral energy/s brought to the surface
upwelling_width = 1500.0
impact_every = 48.0
impact_radius = 700.0
impact_winter = 0.7          # fraction of sunlight blocked at the worst
impact_winter_days = 4.0
impact_minerals = 5000.0
barrier_every = 30.0
barrier_duration = 20.0      # hours at full height
barrier_rise = 0.1           # hours to rise (and to sink)
barrier_width = 200.0

[stats]
sample_interval = 10.0
max_samples = 4000
max_events = 500

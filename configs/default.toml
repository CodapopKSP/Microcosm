# Evolution Sim — default configuration (EVO2 / genome v2)
# Canonical traits: docs/Genome_Definition.md
[world]
width = 3000.0
height = 1500.0
boundary = "bounce"
initial_population = 5
default_agent_radius = 12.0
min_speed = 10.0
max_speed = 255.0

# Angled terrain obstacles (center, size, rotation in degrees, optional color).
# color: [r, g, b, a] in 0.0–1.0, or "#rrggbb" / "#rrggbbaa" hex (default dark stone).
[[world.structures]]
center = [-1150.0, 250.0]
width = 70.0
height = 520.0
angle_deg = 28.0
color = "#5c4a3a"

[[world.structures]]
center = [-950.0, 200.0]
width = 260.0
height = 55.0
angle_deg = 18.0
color = "#5c4a3a"

[[world.structures]]
center = [1180.0, -180.0]
width = 90.0
height = 440.0
angle_deg = -34.0
color = "#5c4a3a"


[[world.structures]]
center = [820.0, 700.0]
width = 220.0
height = 48.0
angle_deg = -22.0
color = "#5c4a3a"

[[world.structures]]
center = [350.0, 320.0]
width = 180.0
height = 420.0
angle_deg = 55.0
color = "#5c4a3a"

[[world.structures]]
center = [-350.0, 0.0]
width = 140.0
height = 36.0
angle_deg = 40.0
color = "#5c4a3a"

[[world.structures]]
center = [450.0, -620.0]
width = 420.0
height = 42.0
angle_deg = 90.0
color = "#5c4a3a"

[world.physics]
radius_threshold = 10.0
brownian_speed = 10.0
gravity_speed = 10.0
crowding_enabled = true
crowding_interval_ticks = 120
crowding_interval_phase_ticks = 0

[performance]
max_entities = 5000
failsafe_policy = "despawn_lowest_energy"
failsafe_cull_count = 3000
corpse_max = 1000
corpse_cull_count = 500

[genetics]
genome_version = 2
core_length = 39
max_genome_bytes = 512
max_pursue_slots = 1
max_avoid_slots = 1
# EVO2 + 24-byte core + 1 pursue + 1 avoid slot (6 B each); I = 01 01
ancestor_hex = "45564f3200ff05000f0000000080ff8000000000f00f0000000101000000000000000000000000"
[genetics.mutation_v2]
passes_min = 4
passes_max = 8
p_large_step = 0.50
large_step_min = 5
large_step_max = 10
body_radius_step_multiplier = 30.0

[genetics.decode_v2]
nibble_levels = 16
channel_max = 255.0
radius_at_zero = 9.0
radius_at_max = 800.00
energy_bonus_at_max = 6553.5
metabolism_bonus_at_max = 1.0
stroke_max = 25.5
metabolism_pct_at_max = 0.01
speed_penalty_at_max = 0.065535
heal_base_hp_per_sec = 1.0
heal_speed_mult_at_max = 3.27675
heal_cost_mult_at_max = 13.107
energy_cap_frac_at_byte0 = 0.99
energy_cap_frac_at_byte255 = 0.01
vitality_budget_from_radius = true
byte_scale = 255.0
turn_chance_max_per_sec = 0.30
turn_degrees_max = 180.0
max_speed_at_max_byte = 255.0
movement_cost_reduction_at_max = 0.052
photo_rate_per_sec_per_radius = 0.1
sensor_distance_at_high_nibble_f = 610.0
sensor_width_deg_at_low_nibble_f = 35.0
sensor_ray_count = 8

[genetics.triad]
coupling_mode = "max_other"
coupling_strength = 1.0

[genetics.behavior]
fuzzy_nibble_delta = 1
avoid_flee_heading_offset_deg = 180.0
sensor_upkeep_per_eye_per_tick = 0.0015
sensor_upkeep_strength_scale = 0.2
sensor_ray_interval_ticks = 60
sensor_ray_phase_ticks = 0

[economy]
metabolism_floor = 0.001
spawn_energy = 400.0
flat_energy_grant_per_tick = 0.0
core_max_hp = 100.0
repro_cooldown_ticks = 500
repro_safety_margin = 0.25
p_death_on_repro_base = 0.12
p_damage_on_repro_base = 0.35
repro_damage_fraction_of_max_hp = 0.12
repro_payment_order = "energy_first"
repair_energy_per_hp = 1.0
repair_hp_per_tick_at_rate_1 = 50.0
repair_policy = "core_first"
move_energy_units_per_radius = 5.0
age_metabolism_cap_multiplier = 3.0
age_metabolism_cap_ticks = 18000.0
age_metabolism_ref_ticks = 3600.0

[environment]
energy_model = "local"
solar_constant = 0.5
light_mode = "gradient_y"
gradient_axis = "y"
gradient_min = 0.0
gradient_max = 1.0
# World Y where light = gradient_min. Omitted ⇒ world edge opposite gradient_bright_at (-height/2 here).
gradient_min_y = 0.0
gradient_bright_at = "top"
minerals_enabled = true
corpses_enabled = true

[environment.dynamic_hazards]
enabled = true
# Upper band near bright top (world Y; map top ≈ +750 for height 1500).
band_y_min = 0.0
band_y_max = 700.0
radius = 50.0
damage_per_tick = 0.025
chem_flux = 0.0
max_active = 15
spawn_interval_ticks = 500
lifetime_min_ticks = 4000
lifetime_max_ticks = 6000

# Chemosynthetic vents in the dark lower band (world Y; map bottom ≈ -750 for height 1500).
[[environment.vents]]
center = [-900.0, -600.0]
radius = 120.0
vent_flux = 0.1

[[environment.vents]]
center = [0.0, -650.0]
radius = 150.0
vent_flux = 0.1

[[environment.vents]]
center = [900.0, -600.0]
radius = 120.0
vent_flux = 0.1

[environment.feeding]
minerals_vent_flux_scale = 1.0
minerals_uptake_per_tick = 10.0
biomass_uptake_per_radius_per_sec = 50.0
biomass_feeding_interval_ticks = 60
biomass_feeding_phase_ticks = 30
corpse_ttl_ticks = 3600
corpse_energy_fraction_of_max_health = 0.25
soup_enabled = false
soup_regen_per_tick = 0.0005
soup_max_concentration = 1.0
soup_initial_concentration = 0.0
soup_uptake_rate = 0.04

[run]
master_seed = 42
max_ticks = 360000
logic_interval_ticks = 6
logic_interval_phase_ticks = 0
snapshot_interval = 60
metrics_path = "metrics.jsonl"

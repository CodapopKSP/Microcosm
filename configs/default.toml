# Evolution Sim — default configuration (Phase 3)
# Loaded at startup from configs/default.toml (see README).

[world]
width = 1000.0
height = 1500.0
boundary = "bounce"
initial_population = 80
default_agent_radius = 12.0
# Initial velocity magnitude at spawn (clamped each tick to phenotype max_speed).
min_speed = 5.0
max_speed = 50.0

[performance]
max_entities = 5000
failsafe_policy = "stop_spawns"

[genetics]
genome_version = 1
core_length = 32
# Header EVO1 + default ancestor (no armor/chemo; photo ~3.0; repro/transfer 100) — docs/GENOME.md
# max_speed locus (core 24–25) = 0x0000 → speed_min (0); offspring can mutate faster.
ancestor_hex = "45564f3188cc446dffff30002800ffff4000ffff088000008000000000008000"
p_bit_flip = 0.05
p_point = 0.58
p_resample = 0.02
p_dup = 0.0
p_del = 0.0
mutations_per_offspring = 5
delta_max = 1

[genetics.decode_ranges]
body_radius_min = 6.0
body_radius_max = 20.0
photo_max = 3.0
k_photo = 0.008
meta_min = 0.001
meta_max = 0.03
loco_max = 1.0
# `max_speed` locus → multiplier on body-derived speed (ancestor raw 0 → speed_min).
speed_min = 0.85
speed_max = 1.15
e_min = 15.0
e_max = 100.0
cd_min = 120.0
cd_max = 2400.0
k_armor = 0.08
k_move_hardness = 0.02
chemo_cliff = 0.35
v_base = 10.0
k_v = 18.0
m_base = 0.0
k_m = 0.0
k_drag = 0.0
r_ref = 12.0
k_move_meta = 0.0
# `max_age` locus scales logarithmic age metabolism (0.5×..2×).
age_metabolism_scale_min = 0.5
age_metabolism_scale_max = 2.0
k_mitigate = 0.5

[economy]
metabolism_floor = 0.001
spawn_energy = 50.0
flat_energy_grant_per_tick = 0.0
core_max_hp = 100.0
repro_safety_margin = 0.25
p_death_on_repro_base = 0.12
p_damage_on_repro_base = 0.35
repro_damage_fraction_of_max_hp = 0.12
repair_energy_per_hp = 1.0
repair_policy = "core_first"
collision_damage_scale = 0.15
# At reference body size, half max speed costs 1 energy/s while moving.
move_energy_per_sec_at_half_speed = 1.0
move_energy_half_speed_ratio = 0.5
# Log age metabolism: ~0 at 1 min, +1 energy/s at 5 min (60 Hz), scaled by gene.
age_metabolism_cap_per_sec = 1.0
age_metabolism_cap_ticks = 18000.0
age_metabolism_ref_ticks = 3600.0

[environment]
energy_model = "local"
# gain/sec ≈ photo_strength * light * solar_constant * 60 (ancestor photo_strength ~3.0 at top → ~3/s)
solar_constant = 0.022
light_mode = "gradient_y"
gradient_axis = "y"
gradient_min = 0.15
gradient_max = 1.0
gradient_bright_at = "top"
crowding_blocks_photosynthesis = false
# Grade photosynthesis by overlap area; 0.5 × overlap fraction, split (n-1)/n when n≥3 share a patch.
overlap_shades_photosynthesis = true
overlap_shade_factor = 0.5

[[environment.hazards]]
center = [200.0, 600.0]
radius = 20.0
damage_per_tick = 2.0

[[environment.hazards]]
center = [300.0, 650.0]
radius = 20.0
damage_per_tick = 2.1

[[environment.hazards]]
center = [400.0, 600.0]
radius = 20.0
damage_per_tick = 1.9

[[environment.hazards]]
center = [300.0, 450.0]
radius = 20.0
damage_per_tick = 2.0

[[environment.hazards]]
center = [400.0, 300.0]
radius = 20.0
damage_per_tick = 2.2

[run]
master_seed = 42
max_ticks = 360000
snapshot_interval = 60
metrics_path = "metrics.jsonl"

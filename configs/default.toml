# Microcosm — default configuration.
#
# Every key is optional: anything omitted takes the built-in default (which is
# exactly what this file contains). Rules are explained in docs/DESIGN.md.
# Units: distances in world units, time in sim seconds, energy in energy units.

[world]
seed = 1                 # life, events, random vents and currents: same seed + config => same run
map = "Deep Ocean"       # world size and terrain from configs/maps/<map>.map or .toml (same for every seed)

[time]
dt = 0.0333333333        # sim seconds per tick; 1x speed = 1/dt ticks per second
day_length = 600.0       # seconds per day/night cycle
year_length = 6.0        # days per year

[light]
cell = 16.0
surface_intensity = 0.1  # energy/s per unit width at the surface at noon
night_level = 0.2       # midnight light as a fraction of noon
season_amplitude = 0.3
half_depth = 400.0       # light halves every this many units of depth
body_absorptance = 0.1   # shade cast by any body
pigment_absorptance = 0.8
photo_yield = 1.0

[temperature]
cell = 64.0
surface = 20.0           # °C
season_amplitude = 6.0
deep = 4.0
thermocline_depth = 700.0
climate_amplitude = 8.0  # slow random climate drift, ±°C
climate_timescale = 40.0 # days
vent_heat = 45.0
vent_heat_radius = 260.0
update_interval = 1.0

[minerals]
cell = 32.0
diffusion = 100.0
decay = 0.004
plume_rise = 4.0         # minerals rise in vent plumes
plume_width = 96.0

[detritus]
cell = 32.0
sink_speed = 3.0         # marine snow (slow, so the water column has food)
decay = 0.0015
to_minerals = 0.5        # decomposed detritus released as minerals
diffusion = 100.0
cave_rate = 6.0e-6       # detritus shed into cave water (energy/s per unit² of cave; painted maps)
cave_nutrients = 3.0e-5  # ...and the nutrients that come with it

[vents]
count = 3                # random vents, besides the permanent ones (which count as shallow)
output = 30.0            # mineral energy/s at full strength
radius = 48.0
halo = 0.35              # share of a vent's minerals seeping out over a wide area around its base
halo_radius = 240.0
lifetime_min = 2.0       # hours
lifetime_max = 8.0
min_depth = 700.0        # vents only open at least this deep
shallow = 2              # vents kept shallow (shelf and upper slope): stepping stones to the deep
shallow_max_depth = 1800.0
deep_min_depth = 3000.0  # the rest open at least this deep

# How gene bytes become traits (docs/DESIGN.md §2).
[genes]
min_radius = 1.0
size_doubling = 32.0     # size gene steps per doubling of radius
speed_scale = 20.0       # max speed = swimming strength (from parts) x this x sqrt(radius)
lifespan_base = 300.0
longevity_max = 4.0
reserves_min = 0.3
reserves_max = 3.0
toughness_min = 0.3
toughness_max = 2.0
regen_min = 0.002
regen_max = 0.05
turn_min = 0.3
turn_max = 6.0
sense_cap = 1200.0
temp_max = 40.0
tolerance_min = 1.0
tolerance_max = 15.0
segment_cost = 0.1          # extra body-building cost per additional segment
generalist_penalty = 0.4   # each diet loses this x the investment in the others
photo_scavenge_penalty = 0.2  # photosynthesis and scavenging also lose this x each other's gene

# Body parts (P chromosome). Per-kind numbers live in parts.rs; these are the shared knobs.
[parts]
small_swimmer_radius = 8.0   # flagella and cilia lose most of their push above this radius
large_swimmer_radius = 6.0   # fins and flukes become efficient around this radius
crawl_speed = 12.0           # walking speed on rock at full leg strength (x sqrt(radius))
sense_range = 16.0           # sense range eyes and antennae add all round, in body radii
tentacle_reach = 1.0         # a tentacle grasps within this fraction of its length of its base
frond_span = 0.45            # extra light-catching width per unit of frond length
frond_uptake = 0.3           # extra nutrient-uptake surface per unit of frond length
stalk_bonus = 1.3            # parts on a stalk's tip work this much better
lure_brightness = 0.3        # full lure light, as a fraction of surface noon light
lure_radius = 160.0          # glow radius of a full lure
contact_margin = 2.0         # distance from rock that still counts as touching
shell_insulation = 1.0       # each full-size shell plate widens the tolerated temperatures by +-1 C
base_sense = 4.0             # everyone senses everything this far around (body radii): light, water, bodies, carcasses

# Running cost of each capability at full strength, as a fraction of basal metabolism.
[upkeep]
buoyancy = 0.3
reserves = 0.3
longevity = 0.4
photo = 0.3
chemo = 0.3
scavenge = 0.3
hunt = 0.3
regen = 0.2
toughness = 0.3
tolerance = 0.4          # temperature tolerance
uptake = 0.2
fixation = 0.2
toxin = 0.3
resistance = 0.3
segments = 0.05          # per body segment beyond the first
parts = 1.5              # multiplier on each part's own upkeep

# What organisms take from and give to the water. Oxygen and CO2 are measured so that
# 1.0 = water in equilibrium with today's air.
[chemistry]
oxygen_per_energy = 2.0     # O2 made by photosynthesis / used by respiration, per unit of energy
co2_per_energy = 2.0
oxygen_half = 0.25          # below this oxygen level, aerobic respiration falters
ferment_penalty = 0.6       # fermenting costs this much more than breathing
ferment_floor = 0.25        # fermentation capacity every organism has
ferment_waste = 0.5         # share of fermentation's extra cost leaked as organic waste
suffocation_damage = 0.2    # fraction of max HP per second at a total shortfall
oxygen_toxicity = 0.05      # damage to strict fermenters per unit of oxygen above 0.5
co2_half = 0.3              # CO2 level where oxygen-producing photosynthesis slows
sulfur_minerals = 0.3       # minerals used per energy of sulfur-based photosynthesis
sulfur_half = 0.05          # mineral concentration for half-speed sulfur photosynthesis
nutrient_per_mass = 1.0     # nutrients needed per unit of body mass
nutrient_store = 1.0        # nutrient store per unit of body mass
uptake_rate = 1.0           # rate x gene x radius x surface x concentration
anchor_uptake = 3.0         # uptake multiplier while anchored by a holdfast
fixation_rate = 0.01        # nutrients fixed per second per unit of mass
fixation_cost = 0.5         # energy per unit of nutrient fixed
toxin_rate = 0.05           # toxin leaked per second = rate x gene x radius
toxin_damage = 2.0          # fraction of HP per second per unit of concentration (/(1 + radius/8))
toxin_decay = 0.02          # fraction of toxin broken down per second
poison_damage = 0.8         # damage to a hunter per unit of toxic prey eaten
diffusion = 600.0
ventilation = 0.0003        # water relaxes toward its usual make-up (unmodeled circulation)
nutrient_surface = 0.05
nutrient_deep = 0.5
nutricline_depth = 1200.0
deep_oxygen = 0.7           # deep water holds this much oxygen relative to the surface
vent_co2 = 4.0              # per second at full strength
vent_nutrients = 2.0
vent_oxygen_sink = 0.05     # vents release oxygen-free water
anoxic_decay = 0.5          # decomposition without oxygen is slower...
anoxic_minerals = 0.9       # ...and releases more minerals (sulfides)
decomposition_oxygen = 1.0  # oxygen used by rotting marine snow (x oxygen_per_energy)
upwelling_nutrients = 0.5   # nutrients per unit of upwelled minerals

# The air: two global levels (1.0 = today) that the ocean surface trades with.
[atmosphere]
surface_exchange = 0.02     # fraction per second surface water moves toward equilibrium
size = 40.0                 # bigger = the air changes more slowly
greenhouse = 3.0            # degrees C of warming per doubling of CO2
initial_oxygen = 1.0        # try 0.05 for an anoxic early Earth
initial_co2 = 1.0

[metabolism]
basal = 0.003             # × mass^0.75 × upkeep, energy/s
move_cost = 3.0          # full-throttle swimming cost, × basal
build_cost = 1.25        # energy per unit of body mass built
body_energy = 1.0        # energy per unit of body mass eaten
growth_rate = 0.05       # max growth per second, fraction of mass
growth_buffer = 0.5      # juveniles keep this much of their reserves
regen_cost = 1.5         # energy per HP healed
starvation_damage = 1.0
temp_stress_cost = 0.5
temp_damage = 0.05
old_age_death_rate = 0.2

[feeding]
chemo_rate = 20.0           # mineral uptake per second = rate × capability × radius × concentration
chemo_yield = 1.0
scavenge_rate = 12.0
filter_rate = 0.05
carcass_rate = 0.5
assimilation = 0.8
engulf_ratio = 0.6       # prey at most this fraction of the hunter's radius is swallowed whole
engulf_rate = 3.0
kin_hunger = 0.5         # hunters spare their own species unless this hungry (0 fed .. 1 starving)
min_hunt = 0.05          # hunting capability below this does nothing (trace genes don't bite)
body_contact = 0.3       # eating through the body away from the mouth works this well
tentacle_pull = 12.0     # speed tentacles drag what they hold to the mouth (x sqrt(radius))
bite_rate = 0.3
armor_protection = 0.75
spike_damage = 0.6
hunger_min = 0.3
hunger_max = 1.7

[physics]
buoyancy_speed = 3.0
brownian = 8.0
response = 20.0
push_stiffness = 0.5
armor_speed_penalty = 0.3
part_density = 1.5       # sinking per unit of part mass
carcass_sink = 2.0
carcass_min_radius = 0.0 # every corpse leaves a carcass (small ones decompose within a minute)
carcass_decay = 0.01

# Curl-noise currents: slow gyres everywhere, eddies stirring the sunlit surface layer.
[currents]
gyre_scale = 3000.0
gyre_speed = 3.0
gyre_period = 900.0
eddy_scale = 450.0
eddy_speed = 8.0
eddy_period = 180.0
mixing_depth = 450.0

[reproduction]
newborn_reserves = 0.5
cooldown = 2.0

[mutation]
rate = 0.03              # chance per gene per offspring
reroll = 0.05            # fraction of mutations that re-roll the gene
step_scale = 2.0         # multiplier on mutation step sizes (±1, 2, 4, 8)
part_type_rate_multiplier = 0.3  # part types change less often (type shifts are big steps)
color_rate_multiplier = 3.0  # color genes mutate faster, so lineages visibly diverge
part_duplicate = 0.003   # chance per offspring that a part is copied into an empty slot
part_delete = 0.004      # chance per offspring that a part is lost
part_new = 0.005         # chance per offspring that a new part grows in an empty slot
diet_shift = 0.005       # chance per offspring that 30-60% of one diet gene jumps to another

[species]
threshold = 0.035         # genetic distance from the founder that starts a new species
genus_threshold = 0.07
color_weight = 0.25
gene_cap = 0.3           # most any single gene adds to distance (so one jump isn't a species)
established = 20         # members needed before a species is named and listed

[population]
# The ancestor: a tiny, floating, green photosynthesizer with no parts, so it can't move.
ancestor = "B:20A050200000 C:55C000 D:FF000000 G:E0FF80000000 H:2030 N:80808080808080808000 P:000000 000000 000000 000000 000000 000000 000000 000000 R:FF00B0 T:80A0"
initial = 2000
spawn_min_depth = 0.0    # life starts between these depths...
spawn_depth = 300.0
spawn_x = [0.0, 1.0]     # ...across this part of the ocean's width (0 = left edge, 1 = right)
max_population = 250000  # safety cap on births
# Optional second founding lineage at the vents, in chromosome notation (empty = none, so
# life has to find its own way down). Example: an anchored, fermenting vent chemosynthesizer:
# "B:207060300000 C:10C040 D:00FF0000 G:400080000000 H:2030 N:80808080808080808000 P:086010 000000 000000 000000 000000 000000 000000 000000 R:FF00B0 T:FFFF"
vent_ancestor = ""
vent_initial = 40        # around each vent at the start (if there is a vent ancestor)

# Random world events. "_every" values are mean sim hours between occurrences (0 = never).
[events]
enabled = true
plague_every = 8.0
plague_min_share = 0.35      # only strikes a species with at least this share of all life
plague_duration = 600.0      # seconds
plague_kill_rate = 0.002     # chance per second for each member to die
upwelling_every = 1.5
upwelling_duration = 1800.0
upwelling_rate = 40.0        # mineral energy/s brought to the surface
upwelling_width = 1500.0
impact_every = 48.0
impact_radius = 700.0
impact_winter = 0.7          # fraction of sunlight blocked at the worst
impact_winter_days = 4.0
impact_minerals = 5000.0
barrier_every = 30.0
barrier_duration = 20.0      # hours at full height
barrier_rise = 0.1           # hours to rise (and to sink)
barrier_width = 200.0

[stats]
sample_interval = 10.0
max_samples = 4000
max_events = 500

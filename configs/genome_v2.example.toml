# Evolution Sim — v2 example / alternate template
# Production default is configs/default.toml (G8 cutover).
# v1 regression: configs/v1_regression.toml
# Canonical traits: docs/Genome_Definition.md

[world]
width = 1000.0
height = 1500.0
boundary = "bounce"
initial_population = 80
default_agent_radius = 12.0
min_speed = 0.0
max_speed = 255.0

[performance]
max_entities = 5000
failsafe_policy = "stop_spawns"

[genetics]
genome_version = 2
# EVO2 header (4) + 24-byte fixed core; no pursue/avoid slots in ancestor
core_length = 28
max_genome_bytes = 512
max_pursue_slots = 8
max_avoid_slots = 8
# 45564f32 + 00FF05 000A 0000 0000 0080 FF0F 00000000 FF0000 0000 0000 (28 B)
ancestor_hex = "45564f3200ff05000a000000000080ff0f00000000ff000000000000"
p_bit_flip = 0.05
p_point = 0.58
p_resample = 0.02
p_dup = 0.0
p_del = 0.0
mutations_per_offspring = 5
delta_max = 1

# Every number from Genome_Definition prose → here (not hard-coded in Rust).
[genetics.decode_v2]
nibble_levels = 16
channel_max = 255.0
radius_at_zero = 4.0
radius_at_max = 1314.70
energy_bonus_at_max = 6553.5
metabolism_bonus_at_max = 6553.5
stroke_max = 25.5
metabolism_pct_at_max = 0.65535
speed_penalty_at_max = 0.65535
heal_base_hp_per_sec = 1.0
heal_speed_mult_at_max = 3.27675
heal_cost_mult_at_max = 13.107
energy_cap_frac_at_byte0 = 0.99
energy_cap_frac_at_byte255 = 0.01
vitality_budget_from_radius = true
byte_scale = 255.0
turn_chance_max_per_sec = 0.30
turn_degrees_max = 180.0
max_speed_at_max_byte = 255.0
movement_cost_reduction_at_max = 0.52
photo_rate_per_sec_per_radius = 0.1
sensor_distance_at_high_nibble_f = 610.0
sensor_width_deg_at_low_nibble_f = 35.0
sensor_ray_count = 8

[genetics.triad]
coupling_mode = "max_other"
coupling_strength = 1.0

[genetics.behavior]
fuzzy_nibble_delta = 1
avoid_flee_heading_offset_deg = 180.0
sensor_upkeep_per_eye_per_tick = 0.002
sensor_upkeep_strength_scale = 1.0

[economy]
metabolism_floor = 0.001
spawn_energy = 50.0
flat_energy_grant_per_tick = 0.0
core_max_hp = 100.0
repro_cooldown_ticks = 192
repro_safety_margin = 0.25
p_death_on_repro_base = 0.12
p_damage_on_repro_base = 0.35
repro_damage_fraction_of_max_hp = 0.12
repro_payment_order = "health_first"
repair_energy_per_hp = 1.0
repair_hp_per_tick_at_rate_1 = 50.0
repair_policy = "core_first"
collision_damage_scale = 0.15
# v2 distance-indexed move cost: 1 energy per (units × body_radius) at movement_efficiency = 0
move_energy_units_per_radius = 10.0
age_metabolism_cap_per_sec = 1.0
age_metabolism_cap_ticks = 18000.0
age_metabolism_ref_ticks = 3600.0

[environment]
energy_model = "local"
# Tuned for v2 photo (`0.1 × radius × photo_eff` per sec) vs radius-linked metabolism on small ancestor
solar_constant = 2.5
light_mode = "gradient_y"
gradient_axis = "y"
gradient_min = 0.15
gradient_max = 1.0
gradient_bright_at = "top"
crowding_blocks_photosynthesis = false
overlap_shades_photosynthesis = true
overlap_shade_factor = 0.5
minerals_enabled = false
corpses_enabled = false

[environment.feeding]
minerals_vent_flux_scale = 25.0
minerals_uptake_per_tick = 0.08
biomass_uptake_per_radius = 0.15
corpse_biomass_frac = 0.4
corpse_ttl_ticks = 3600
soup_enabled = false
soup_regen_per_tick = 0.0005
soup_max_concentration = 1.0
soup_initial_concentration = 0.0
soup_uptake_rate = 0.04

[[environment.hazards]]
center = [300.0, 450.0]
radius = 20.0
damage_per_tick = 0.00833

[[environment.vents]]
center = [0.0, -450.0]
radius = 150.0
vent_flux = 0.032

[run]
master_seed = 42
max_ticks = 360000
snapshot_interval = 60
metrics_path = "metrics_v2.jsonl"

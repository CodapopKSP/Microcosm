[package]
name = "evolution_sim"
version = "0.1.0"
edition = "2021"
description = "Evolution simulation PoC with Bevy"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "png",
    "x11",
    "wayland",
] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

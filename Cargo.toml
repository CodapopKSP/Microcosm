[workspace]
resolver = "3"
members = ["crates/evo_core", "crates/evo_app"]
default-members = ["crates/evo_app"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
glam = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

# Keep dependencies optimized even in dev builds; the sim is unusable unoptimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"

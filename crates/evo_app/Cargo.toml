[package]
name = "evo_app"
description = "Viewer for the evolution simulator"
version.workspace = true
edition.workspace = true

[dependencies]
evo_core = { path = "../evo_core" }
glam.workspace = true
clap = { version = "4", features = ["derive"] }
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "x11",
    "wayland",
    "multi_threaded",
    "2d_bevy_render",
    "default_font",
    "tonemapping_luts",
] }
bevy_egui = { version = "0.42", default-features = false, features = ["render", "default_fonts"] }

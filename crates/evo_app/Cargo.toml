[package]
name = "evo_app"
description = "Microcosm: the viewer for the evolution simulator"
version.workspace = true
edition.workspace = true

[dependencies]
evo_core = { path = "../evo_core" }
glam.workspace = true
clap = { version = "4", features = ["derive"] }
toml = "1"
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "x11",
    "wayland",
    "multi_threaded",
    "2d_bevy_render",
    "default_font",
    "tonemapping_luts",
    "bevy_audio",
    "vorbis",
    "wav",
] }
bevy_egui = { version = "0.42", default-features = false, features = ["render", "default_fonts"] }
# The button sounds' own audio output (see ui_sfx.rs); the same version Bevy plays sound with.
rodio = { version = "0.22", default-features = false, features = ["playback", "tracing"] }

[package]
name = "evo_core"
description = "Simulation core for the evolution simulator (no rendering dependencies)"
version.workspace = true
edition.workspace = true

[dependencies]
glam.workspace = true
serde.workspace = true
rayon = "1.12"
toml = "1"
serde_json = "1"
rmp-serde = "1.3"
lz4_flex = "0.14"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "evo_headless"
path = "src/bin/headless.rs"
